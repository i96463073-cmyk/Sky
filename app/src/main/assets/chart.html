<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0B0E14;color:#eee;font-family:Arial,sans-serif}
#app{display:flex;height:100%}
#tools{width:38px;background:#0B0E14;border-right:1px solid #1A2233;display:flex;flex-direction:column;align-items:center;padding-top:8px;z-index:10}
.tg{width:32px;height:30px;margin-bottom:6px;border-radius:6px;border:1px solid #2A3449;color:#8A93A6;font-size:9px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.tg.on{color:#fff;background:rgba(140,82,255,.35);border-color:#8C52FF}
#wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.pane{position:relative;min-height:50px}
#chart{flex:5;min-height:120px}
#rsi{flex:1.3;border-top:1px solid #1A2233}
#vol{flex:1;border-top:1px solid #1A2233}
#ov{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
#legend{position:absolute;top:4px;left:8px;z-index:5;font-size:11px;background:rgba(11,14,20,.7);padding:3px 7px;border-radius:4px;pointer-events:none}
#legend span{margin-right:7px}
.pl{position:absolute;top:3px;left:8px;z-index:5;font-size:10px;color:#8A93A6;pointer-events:none}
.green{color:#00E676}.red{color:#FF3B5C}.muted{color:#8A93A6}
</style>
<script src="lightweight-charts.js" onerror="window.CHART_LIB_ERROR=true;"></script>
</head>
<body>
<div id="app">
  <div id="tools">
    <div class="tg on" data-k="str">BOS</div>
    <div class="tg on" data-k="ob">OB</div>
    <div class="tg on" data-k="fvg">FVG</div>
    <div class="tg on" data-k="liq">LIQ</div>
    <div class="tg on" data-k="pd">P/D</div>
  </div>
  <div id="wrap">
    <div id="chart" class="pane">
      <div id="legend">
        <b id="lg-sym">XAUUSD</b> <span id="lg-tf" class="muted">15m</span>
        <span>O <b id="lg-o">—</b></span><span>H <b id="lg-h">—</b></span>
        <span>L <b id="lg-l">—</b></span><span>C <b id="lg-c">—</b></span>
        <span id="lg-chg"></span>
      </div>
      <canvas id="ov"></canvas>
    </div>
    <div id="rsi" class="pane"><div class="pl">RSI (14) <b id="lg-rsi" style="color:#B388FF">—</b></div></div>
    <div id="vol" class="pane"><div class="pl">Vol <b id="lg-vol">—</b></div></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const S={sym:'',key:'',bars:[],smc:null,trade:null,autoTrade:null,rev:0,show:{str:true,ob:true,fvg:true,liq:true,pd:true}};
const TFL={M1:'1m',M5:'5m',M15:'15m',M30:'30m',H1:'1h',H4:'4h',D1:'1d'};
const elChart=$('chart'),elRsi=$('rsi'),elVol=$('vol'),cv=$('ov'),ctx=cv.getContext('2d');
let chart,series,rsiChart,rsiSeries,volChart,volSeries;

const num=v=>{if(v==null||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null;};
function toSec(v){if(v==null)return null;if(typeof v==='string'&&isNaN(Number(v))){const d=Date.parse(v);return isNaN(d)?null:Math.floor(d/1000);}let n=Number(v);if(!Number.isFinite(n))return null;if(n>1e11)n/=1000;return Math.floor(n);}
function decs(){const s=String(S.sym);return s.includes('JPY')?3:(s.includes('XAU')||s.includes('BTC'))?2:5;}
const fmt=p=>p==null?'—':Number(p).toFixed(decs());

function calcRSI(closes,period){
  const out=[];if(closes.length<=period)return out;
  let g=0,l=0;
  for(let i=1;i<=period;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d;}
  g/=period;l/=period;
  out.push({time:S.bars[period].time,value:100-100/(1+g/(l||1e-9))});
  for(let i=period+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    g=(g*(period-1)+(d>0?d:0))/period;l=(l*(period-1)+(d<0?-d:0))/period;
    out.push({time:S.bars[i].time,value:100-100/(1+g/(l||1e-9))});
  }
  return out;
}

function analyse(bars){
  const n=bars.length,L=3;
  const o={events:[],obs:[],fvgs:[],liq:[],sweeps:[],range:null};
  if(n<20)return o;
  let sum=0,cnt=0;for(let i=Math.max(0,n-50);i<n;i++){sum+=bars[i].high-bars[i].low;cnt++;}
  const avg=sum/cnt;
  const swH=[],swL=[];let lastH=null,lastL=null,trend=0;
  for(let i=0;i<n;i++){
    const p=i-L;
    if(p>=L){
      let isH=true,isL=true;
      for(let k=1;k<=L;k++){
        if(!(bars[p].high>bars[p-k].high&&bars[p].high>=bars[p+k].high))isH=false;
        if(!(bars[p].low<bars[p-k].low&&bars[p].low<=bars[p+k].low))isL=false;
      }
      if(isH){lastH={i:p,price:bars[p].high,broken:false};swH.push(lastH);}
      if(isL){lastL={i:p,price:bars[p].low,broken:false};swL.push(lastL);}
    }
    const b=bars[i];
    if(lastH&&!lastH.broken&&b.close>lastH.price){
      lastH.broken=true;
      const type=trend===-1?'CHoCH':'BOS';trend=1;
      o.events.push({type,dir:1,i0:lastH.i,i1:i,price:lastH.price});
      let m=-1,lo=Infinity;
      for(let k=lastH.i;k<i;k++){if(bars[k].low<lo){lo=bars[k].low;m=k;}}
      if(m>=0){
        let end=n-1,mit=false;
        for(let j=i+1;j<n;j++){if(bars[j].close<bars[m].low){end=j;mit=true;break;}}
        o.obs.push({dir:1,i0:m,i1:end,top:bars[m].high,bot:bars[m].low,mit});
      }
    }
    if(lastL&&!lastL.broken&&b.close<lastL.price){
      lastL.broken=true;
      const type=trend===1?'CHoCH':'BOS';trend=-1;
      o.events.push({type,dir:-1,i0:lastL.i,i1:i,price:lastL.price});
      let m=-1,hi=-Infinity;
      for(let k=lastL.i;k<i;k++){if(bars[k].high>hi){hi=bars[k].high;m=k;}}
      if(m>=0){
        let end=n-1,mit=false;
        for(let j=i+1;j<n;j++){if(bars[j].close>bars[m].high){end=j;mit=true;break;}}
        o.obs.push({dir:-1,i0:m,i1:end,top:bars[m].high,bot:bars[m].low,mit});
      }
    }
  }
  const minGap=avg*0.1;
  for(let i=2;i<n;i++){
    const a=bars[i-2],c=bars[i];
    if(c.low-a.high>minGap){
      let end=n-1,mit=false;for(let j=i+1;j<n;j++){if(bars[j].low<=a.high){end=j;mit=true;break;}}
      o.fvgs.push({dir:1,i0:i-2,i1:end,top:c.low,bot:a.high,mit});
    }else if(a.low-c.high>minGap){
      let end=n-1,mit=false;for(let j=i+1;j<n;j++){if(bars[j].high>=a.low){end=j;mit=true;break;}}
      o.fvgs.push({dir:-1,i0:i-2,i1:end,top:a.low,bot:c.high,mit});
    }
  }
  const tol=avg*0.25;
  const scan=(arr,side)=>{
    arr.slice(-25).forEach(s=>{
      let touch=-1;
      for(let j=s.i+L+1;j<n;j++){
        if(side==='H'?bars[j].high>s.price:bars[j].low<s.price){touch=j;break;}
      }
      if(touch<0){
        const eq=arr.some(t=>t!==s&&Math.abs(t.price-s.price)<=tol);
        o.liq.push({side,i0:s.i,price:s.price,label:eq?(side==='H'?'EQH':'EQL'):(side==='H'?'BSL':'SSL')});
      }else{
        const closeBack=side==='H'?bars[touch].close<s.price:bars[touch].close>s.price;
        if(closeBack&&n-touch<150)o.sweeps.push({side,i0:s.i,i:touch,price:s.price});
      }
    });
  };
  scan(swH,'H');scan(swL,'L');
  o.liq=o.liq.slice(-5);
  o.sweeps.sort((a,b)=>a.i-b.i);o.sweeps=o.sweeps.slice(-3);
  const N=Math.min(n,100);let hi=-Infinity,lo=Infinity;
  for(let i=n-N;i<n;i++){if(bars[i].high>hi)hi=bars[i].high;if(bars[i].low<lo)lo=bars[i].low;}
  o.range={i0:n-N,hi,lo,eq:(hi+lo)/2};
  return o;
}

function normTrade(o){
  if(!o||typeof o!=='object')return null;
  const dir=String(o.direction||o.side||'').toUpperCase();
  const entry=num(o.entry!=null?o.entry:o.entry_price);
  const sl=num(o.stop_loss!=null?o.stop_loss:o.sl);
  let tps=o.tps||o.take_profits||o.take_profit||o.tp;
  if(tps==null)tps=[o.tp1,o.tp2,o.tp3];
  if(!Array.isArray(tps))tps=[tps];
  tps=tps.map(num).filter(v=>v!=null);
  if(!(dir==='BUY'||dir==='SELL')||entry==null||sl==null)return null;
  return {dir,entry,sl,tps,t:toSec(o.time||o.created_at)};
}
function idxOfTime(t){if(t==null)return -1;for(let i=0;i<S.bars.length;i++){if(S.bars[i].time>=t)return i;}return -1;}

function draw(){
  const w=elChart.clientWidth,h=elChart.clientHeight;
  ctx.clearRect(0,0,w,h);
  const bars=S.bars,n=bars.length;
  if(!n||!S.smc)return;
  const ts=chart.timeScale();
  let pw=w-chart.priceScale('right').width();if(!(pw>0))pw=w;
  const X=i=>ts.logicalToCoordinate(i);
  const Y=p=>series.priceToCoordinate(p);
  const sm=S.smc,sh=S.show;

  function tag(text,x,y,fg,bg,align){
    ctx.font='bold 10px Arial';
    const tw=ctx.measureText(text).width+10;
    let x0=align==='right'?x-tw:align==='center'?x-tw/2:x;
    x0=Math.max(2,Math.min(pw-tw-2,x0));
    if(bg){ctx.fillStyle=bg;ctx.fillRect(x0,y-8,tw,16);}
    ctx.fillStyle=fg;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(text,x0+5,y);
  }
  function box(x0,x1,t,b,fill,stroke,label,lc){
    const y0=Y(t),y1=Y(b);if(x0==null||y0==null||y1==null)return;
    const top=Math.min(y0,y1),hh=Math.max(1,Math.abs(y1-y0)),ww=x1-x0;if(ww<=0)return;
    ctx.fillStyle=fill;ctx.fillRect(x0,top,ww,hh);
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.setLineDash([]);ctx.strokeRect(x0+.5,top+.5,ww,hh);}
    const vx0=Math.max(x0,0),vx1=Math.min(x1,pw);
    if(label&&vx1-vx0>46&&hh>12){ctx.fillStyle=lc||'#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,(vx0+vx1)/2,top+hh/2);}
  }
  function hline(x0,x1,p,color,dash,lw){
    const y=Y(p);if(x0==null||y==null)return;
    ctx.strokeStyle=color;ctx.lineWidth=lw||1;ctx.setLineDash(dash||[]);
    ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.setLineDash([]);
  }

  ctx.save();ctx.beginPath();ctx.rect(0,0,pw,h);ctx.clip();

  if(sh.pd&&sm.range){
    const r=sm.range,x0=X(r.i0);
    box(x0,pw,r.hi,r.eq,'rgba(255,59,92,.07)',null);
    box(x0,pw,r.eq,r.lo,'rgba(0,230,118,.07)',null);
    hline(x0,pw,r.eq,'rgba(138,147,166,.7)',[4,4]);
    const yh=Y(r.hi),yl=Y(r.lo),ye=Y(r.eq);
    if(yh!=null)tag('Premium Zone',pw-4,yh+10,'#FF8FA3',null,'right');
    if(yl!=null)tag('Discount Zone',pw-4,yl-10,'#5CE6A8',null,'right');
    if(ye!=null)tag('EQ',pw-4,ye-9,'#8A93A6',null,'right');
  }
  if(sh.fvg){
    sm.fvgs.filter(f=>!f.mit).slice(-4).forEach(f=>{
      box(X(f.i0),pw,f.top,f.bot,'rgba(0,200,190,.18)','rgba(0,200,190,.7)','FVG','#7DF3EA');
    });
  }
  if(sh.ob){
    const bull=sm.obs.filter(x=>x.dir===1&&!x.mit).slice(-3);
    const bear=sm.obs.filter(x=>x.dir===-1&&!x.mit).slice(-3);
    bull.forEach(x=>box(X(x.i0),pw,x.top,x.bot,'rgba(0,230,118,.16)','#00E676','Bullish OB','#B8FFD9'));
    bear.forEach(x=>box(X(x.i0),pw,x.top,x.bot,'rgba(255,59,92,.18)','#FF3B5C','Bearish OB','#FFC2CC'));
  }
  if(sh.liq){
    sm.liq.forEach(l=>{
      const x0=X(l.i0);hline(x0,pw,l.price,'#B388FF',[5,4],1);
      const y=Y(l.price);if(y!=null)tag(l.label,Math.max(x0,0)+4,y+(l.side==='H'?-9:9),'#D9C4FF',null,'left');
    });
    sm.sweeps.forEach(s=>{
      const x0=X(s.i0),x1=X(s.i);hline(x0,x1,s.price,'#B388FF',[3,3],1);
      const b=bars[s.i],yw=Y(s.side==='H'?b.high:b.low);
      if(x1!=null&&yw!=null){
        const dy=s.side==='H'?-12:12;
        ctx.fillStyle='#B388FF';ctx.beginPath();
        ctx.moveTo(x1,yw+dy*0.2);ctx.lineTo(x1-4,yw+dy*0.8);ctx.lineTo(x1+4,yw+dy*0.8);ctx.closePath();ctx.fill();
        tag('Liquidity Sweep',x1,yw+dy*2,'#fff','rgba(140,82,255,.45)','center');
      }
    });
  }
  if(sh.str){
    sm.events.slice(-6).forEach(e=>{
      const x0=X(e.i0),x1=X(e.i1),y=Y(e.price);if(x0==null||x1==null||y==null)return;
      const col=e.type==='CHoCH'?'#FFB300':'#DDE3F0';
      ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.2;ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x1-6,y-3);ctx.lineTo(x1-6,y+3);ctx.closePath();ctx.fill();
      tag(e.type,(x0+x1)/2,y+(e.dir>0?-9:9),col,'rgba(11,14,20,.8)','center');
    });
  }
  const tr=S.trade||S.autoTrade;
  if(tr){
    let i0=idxOfTime(tr.t);if(i0<0)i0=Math.max(0,n-40);
    let xs=X(i0);if(xs==null)xs=0;xs=Math.max(0,xs);
    const far=tr.tps.length?tr.tps[tr.tps.length-1]:null;
    if(far!=null)box(xs,pw,tr.entry,far,'rgba(0,230,118,.10)',null);
    box(xs,pw,tr.entry,tr.sl,'rgba(255,59,92,.15)',null);
    hline(xs,pw,tr.sl,'#FF3B5C',[],1.2);
    tr.tps.forEach(p=>hline(xs,pw,p,'#00E676',[5,3],1));
    hline(xs,pw,tr.entry,'#00B0FF',[],1.6);
    tr.tps.forEach((p,k)=>{const y=Y(p);if(y!=null)tag('TP'+(k+1)+'  '+fmt(p),pw-4,y,'#fff','rgba(0,140,80,.9)','right');});
    const ye=Y(tr.entry),ys=Y(tr.sl);
    if(ye!=null)tag(tr.dir+' Entry  '+fmt(tr.entry),pw-4,ye,'#fff','rgba(0,120,200,.95)','right');
    if(ys!=null)tag('SL  '+fmt(tr.sl),pw-4,ys,'#fff','rgba(200,40,70,.95)','right');
  }
  ctx.restore();
}

function setLegend(b){
  if(!b)return;
  $('lg-o').textContent=fmt(b.open);$('lg-h').textContent=fmt(b.high);
  $('lg-l').textContent=fmt(b.low);$('lg-c').textContent=fmt(b.close);
  const up=b.close>=b.open;
  $('lg-c').className=up?'green':'red';
  const ch=b.close-b.open,pc=b.open?ch/b.open*100:0;
  const el=$('lg-chg');el.textContent=(ch>=0?'+':'')+fmt(ch)+' ('+(pc>=0?'+':'')+pc.toFixed(2)+'%)';
  el.className=up?'green':'red';
}

function init(){
  if(window.CHART_LIB_ERROR||!window.LightweightCharts){$('lg-sym').textContent='Library Missing';return false;}
  const base=()=>({
    layout:{background:{type:'solid',color:'#0B0E14'},textColor:'#8A93A6',fontSize:10},
    grid:{vertLines:{color:'rgba(26,34,51,.5)'},horzLines:{color:'#1A2233'}},
    rightPriceScale:{borderColor:'#1A2233',minimumWidth:64,autoScale:true},
    timeScale:{visible:false,borderColor:'#1A2233',timeVisible:true,secondsVisible:false,rightOffset:12}
  });
  chart=LightweightCharts.createChart(elChart,Object.assign(base(),{crosshair:{mode:LightweightCharts.CrosshairMode.Normal}}));
  series=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#00E676',downColor:'#FF3B5C',borderVisible:false,wickUpColor:'#00E676',wickDownColor:'#FF3B5C'});
  rsiChart=LightweightCharts.createChart(elRsi,base());
  rsiSeries=rsiChart.addSeries(LightweightCharts.LineSeries,{color:'#B388FF',lineWidth:1.5,priceLineVisible:false});
  [70,30].forEach(p=>rsiSeries.createPriceLine({price:p,color:'#3A2F5A',lineWidth:1,lineStyle:2,axisLabelVisible:false}));
  const vo=base();vo.timeScale.visible=true;
  volChart=LightweightCharts.createChart(elVol,vo);
  volSeries=volChart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceLineVisible:false});

  let syncing=false;
  const link=(src,others)=>src.timeScale().subscribeVisibleLogicalRangeChange(r=>{
    if(syncing||!r)return;syncing=true;
    others.forEach(c=>c.timeScale().setVisibleLogicalRange(r));syncing=false;
  });
  link(chart,[rsiChart,volChart]);link(rsiChart,[chart,volChart]);link(volChart,[chart,rsiChart]);

  chart.subscribeCrosshairMove(p=>{
    const d=p&&p.seriesData?p.seriesData.get(series):null;
    if(d)setLegend(d);else setLegend(S.bars[S.bars.length-1]);
  });

  document.querySelectorAll('.tg').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;S.show[k]=!S.show[k];b.classList.toggle('on',S.show[k]);S.rev++;
  });

  const resize=()=>{
    const w=elChart.clientWidth,h=elChart.clientHeight;if(!w||!h)return;
    chart.applyOptions({width:w,height:h});
    rsiChart.applyOptions({width:elRsi.clientWidth,height:elRsi.clientHeight});
    volChart.applyOptions({width:elVol.clientWidth,height:elVol.clientHeight});
    const dpr=window.devicePixelRatio||1;
    cv.style.width=w+'px';cv.style.height=h+'px';
    cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    S.rev++;
  };
  window.addEventListener('resize',resize);
  if(window.ResizeObserver){new ResizeObserver(resize).observe(elChart);}
  setTimeout(resize,100);

  let sig='';
  let lastDraw = 0;
  
  // ✅ THROTTLED LOOP: Redraws at ~15 FPS instead of 60 FPS to prevent lag
  (function loop(timestamp){
    if (timestamp - lastDraw > 66 && S.bars.length){
      const r=chart.timeScale().getVisibleLogicalRange();
      const y=series.priceToCoordinate(S.bars[S.bars.length-1].close);
      const s=[r&&r.from,r&&r.to,y,elChart.clientWidth,elChart.clientHeight,S.rev].join('|');
      if(s!==sig){sig=s;draw();}
      lastDraw = timestamp;
    }
    requestAnimationFrame(loop);
  })();
  return true;
}

window.tick=function(p){
  if(!series||!S.bars.length)return;
  p=Number(p);if(!Number.isFinite(p))return;
  const last=S.bars[S.bars.length-1];
  last.close=p;last.high=Math.max(last.high,p);last.low=Math.min(last.low,p);
  series.update({time:last.time,open:last.open,high:last.high,low:last.low,close:last.close});
  setLegend(last);
};

window.setTrade=function(t){S.trade=normTrade(t);S.rev++;};

window.renderSignal=function(data,key){
  if(!chart||!series)return;
  try{
    const m=data.market||{};
    const raw=m.candles||data.candles||[];
    const map=new Map();
    raw.forEach(c=>{
      const t=toSec(c.time!=null?c.time:(c.openTime!=null?c.openTime:c.t));if(!t)return;
      const o=num(c.open),h=num(c.high),l=num(c.low),cl=num(c.close);
      if(o==null||h==null||l==null||cl==null)return;
      map.set(t,{time:t,open:o,high:h,low:l,close:cl,volume:num(c.volume)||num(c.tickVolume)||num(c.tick_volume)||0});
    });
    const bars=Array.from(map.values()).sort((a,b)=>a.time-b.time);
    if(!bars.length)return;
    
    S.sym=data.symbol||S.sym||'XAUUSD';
    const d=decs();
    series.applyOptions({priceFormat:{type:'price',precision:d,minMove:1/Math.pow(10,d)}});
    
    S.bars=bars;
    series.setData(bars);
    
    chart.priceScale('right').applyOptions({ autoScale: true });
    
    rsiSeries.setData(calcRSI(bars.map(b=>b.close),14));
    volSeries.setData(bars.map(b=>({time:b.time,value:b.volume,color:b.close>=b.open?'rgba(0,230,118,.35)':'rgba(255,59,92,.35)'})));
    
    S.smc=analyse(bars);
    S.autoTrade=normTrade(data.signal||data.setup||data.trade);
    
    if(key!==S.key){
      S.key=key;
      S.trade=null;
      
      chart.timeScale().fitContent();
      const n=bars.length;
      if(n>0){
        chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-80),to:n+10});
      }
    }
    
    const tfk=(key||'').split('|')[1];
    $('lg-sym').textContent=S.sym;
    $('lg-tf').textContent=m.timeframe||TFL[tfk]||tfk||'';
    setLegend(bars[bars.length-1]);
    const rr=calcRSI(bars.map(b=>b.close),14);
    if(rr.length)$('lg-rsi').textContent=rr[rr.length-1].value.toFixed(1);
    $('lg-vol').textContent=String(bars[bars.length-1].volume||0);
    S.rev++;
  }catch(e){console.error(e);}
};

init();
})();
</script>
