<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0B0E14;color:#eee;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column}
#wrap{position:relative;flex:1;min-height:220px}
#chart{position:absolute;inset:0}
#ov{position:absolute;inset:0;pointer-events:none;z-index:2}
#legend{position:absolute;top:6px;left:8px;z-index:3;font-size:11px;color:#8A93A6;pointer-events:none}
#tg{position:absolute;top:24px;left:8px;z-index:3;display:flex;gap:5px;flex-wrap:wrap;max-width:75%}
.tg{font-size:10px;padding:3px 8px;border-radius:10px;border:1px solid #2A3449;background:#131824cc;color:#8A93A6}
.tg.on{color:#00E676;border-color:#00E676}
#panel{max-height:36%;overflow:auto;background:#131824;border-top:1px solid #2A3449;padding:10px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.tag{padding:4px 8px;border:1px solid #2A3449;border-radius:12px;font-size:11px;color:#ccc}
#decision{font-weight:bold;font-size:14px;padding:5px 10px;border-radius:14px;border:1px solid}
#price{margin-left:auto;font-weight:bold;font-size:18px}
#detail{font-size:12px;line-height:1.5;color:#ccc;white-space:pre-wrap}
.green{color:#00E676;border-color:#00E676}.red{color:#FF3B5C;border-color:#FF3B5C}.amber{color:#FFB300;border-color:#FFB300}
</style>
<!-- LOCAL LIBRARY -->
<script src="lightweight-charts.js"></script>
</head>
<body>
<div id="wrap">
  <div id="chart"></div>
  <canvas id="ov"></canvas>
  <div id="legend"></div>
  <div id="tg"></div>
</div>
<div id="panel">
  <div class="row"><span id="decision" class="amber">Loading…</span><span id="price"></span></div>
  <div class="row"><span class="tag" id="tf"></span><span class="tag" id="provider"></span><span class="tag" id="count"></span></div>
  <div id="detail"></div>
</div>
<script>
(function(){
const TF_SEC={M1:60,M5:300,M15:900,M30:1800,H1:3600,H4:14400,D1:86400};
const S={key:'',sym:'',tf:'M15',bars:[],forming:null,zones:[],events:[],setup:null,lines:[],
         show:{filled:false,ob:true,fvg:true,struct:true,pd:true,lvl:true}};
const wrap=document.getElementById('wrap'),el=document.getElementById('chart'),cv=document.getElementById('ov'),ctx=cv.getContext('2d');
let chart=null,series=null,volumeSeries=null,raf=0;

const $=id=>document.getElementById(id);
const setText=(id,v)=>{$(id).textContent=v==null?'':String(v);};
const num=v=>{if(v==null||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null;};
function toSec(v){
  if(v==null)return null;
  if(typeof v==='string'&&isNaN(Number(v))){const d=Date.parse(v);return isNaN(d)?null:Math.floor(d/1000);}
  let n=Number(v);if(!Number.isFinite(n))return null;if(n>1e11)n/=1000;return Math.floor(n);
}
const dec=s=>String(s).includes('JPY')?3:(String(s).includes('XAU')?2:5);
const fmt=(p)=>p==null?'—':Number(p).toFixed(dec(S.sym));

function init(){
  if(!window.LightweightCharts){setText('decision','Chart library failed to load.');return;}
  chart=LightweightCharts.createChart(el,{
    width:el.clientWidth,height:el.clientHeight,
    layout:{background:{type:'solid',color:'#0B0E14'},textColor:'#8A93A6',fontSize:11},
    grid:{vertLines:{color:'#131824'},horzLines:{color:'#131824'}},
    rightPriceScale:{borderColor:'#2A3449',autoScale:true,scaleMargins:{top:.08,bottom:.2}}, 
    timeScale:{borderColor:'#2A3449',timeVisible:true,secondsVisible:false,rightOffset:8},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:true},
    handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:true}
  });
  series=chart.addSeries(LightweightCharts.CandlestickSeries,{
    upColor:'#00E676',downColor:'#FF3B5C',borderUpColor:'#00E676',borderDownColor:'#FF3B5C',
    wickUpColor:'#00E676',wickDownColor:'#FF3B5C',priceLineColor:'#8C52FF'
  });
  
  volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat: { type: 'volume' },
      priceScaleId: '', 
      scaleMargins: { top: 0.8, bottom: 0 },
  });

  chart.timeScale().subscribeVisibleLogicalRangeChange(sched);
  chart.subscribeCrosshairMove(sched);
  ['pointermove','touchmove','wheel'].forEach(e=>el.addEventListener(e,sched,{passive:true}));
  const resize=()=>{chart.applyOptions({width:el.clientWidth,height:el.clientHeight});sizeCanvas();sched();};
  if(window.ResizeObserver)new ResizeObserver(resize).observe(el);else window.addEventListener('resize',resize);
  sizeCanvas();buildToggles();
}
function sizeCanvas(){
  const d=window.devicePixelRatio||1;
  cv.width=wrap.clientWidth*d;cv.height=wrap.clientHeight*d;
  cv.style.width=wrap.clientWidth+'px';cv.style.height=wrap.clientHeight+'px';
  ctx.setTransform(d,0,0,d,0,0);
}
function buildToggles(){
  const defs=[['ob','OB'],['fvg','FVG'],['filled','Filled'],['struct','Structure'],['pd','P/D'],['lvl','Levels']];
  const box=$('tg');
  defs.forEach(([k,label])=>{
    const b=document.createElement('span');b.className='tg'+(S.show[k]?' on':'');b.textContent=label;
    b.onclick=()=>{S.show[k]=!S.show[k];b.classList.toggle('on',S.show[k]);if(k==='lvl')applyLevels();sched();};
    box.appendChild(b);
  });
}

function extract(root,out,depth){
  if(root==null||depth>8)return;
  if(Array.isArray(root)){root.forEach(v=>extract(v,out,depth+1));return;}
  if(typeof root!=='object')return;
  const type=String(root.type||root.kind||root.label||root.name||'');
  const top=num(root.top!=null?root.top:root.high),bot=num(root.bottom!=null?root.bottom:root.low);
  if(top!=null&&bot!=null&&/fvg|fair value|order.?block|\bob\b/i.test(type)){
    const kind=/fvg|fair/i.test(type)?'FVG':'OB';
    const ds=String(root.direction||root.bias||root.side||type).toLowerCase();
    const dir=/bull|buy|long|\bup\b/.test(ds)?'bull':(/bear|sell|short|down/.test(ds)?'bear':'neutral');
    const st=String(root.status||'');
    out.zones.push({kind,dir,top:Math.max(top,bot),bottom:Math.min(top,bot),
      start:toSec(root.time!=null?root.time:(root.startTime!=null?root.startTime:(root.start!=null?root.start:root.from))),
      end:toSec(root.endTime!=null?root.endTime:(root.end!=null?root.end:(root.to!=null?root.to:root.mitigatedAt))),
      filled:!!(root.filled||root.mitigated||/fill|mitig/i.test(st))});
  }else{
    const p=num(root.price!=null?root.price:root.level);
    if(p!=null&&/bos|choch|mss|idm|sweep|liquidity|equal/i.test(type)){
      out.events.push({label:(type.match(/bos|choch|mss|idm|sweep|liquidity|equal\w*/i)||[type])[0].toUpperCase(),
        price:p,start:toSec(root.time!=null?root.time:(root.startTime!=null?root.startTime:root.from)),
        end:toSec(root.endTime!=null?root.endTime:(root.breakTime!=null?root.breakTime:root.to))});
    }
  }
  for(const k of Object.keys(root)){if(k==='candles')continue;const v=root[k];if(v&&typeof v==='object')extract(v,out,depth+1);}
}
function dedupe(arr,keyFn){const s=new Set();return arr.filter(x=>{const k=keyFn(x);if(s.has(k))return false;s.add(k);return true;});}

function snap(t){
  const b=S.bars;if(!b.length||t==null)return null;
  let lo=0,hi=b.length-1;
  if(t<=b[0].time)return b[0].time;
  if(t>=b[hi].time)return null; 
  while(lo<hi){const mid=(lo+hi+1)>>1;if(b[mid].time<=t)lo=mid;else hi=mid-1;}
  return b[lo].time;
}
function sched(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;draw();});}
function draw(){
  if(!chart||!series)return;
  const w=wrap.clientWidth,h=wrap.clientHeight;ctx.clearRect(0,0,w,h);
  if(!S.bars.length)return;
  const ts=chart.timeScale();
  const pw=chart.priceScale('right').width();const R=w-pw;
  const X=(t,def)=>{if(t==null)return def;const s=snap(t);if(s==null)return t>S.bars[S.bars.length-1].time?R:def;const c=ts.timeToCoordinate(s);return c==null?def:c;};
  const Y=p=>series.priceToCoordinate(p);
  const bs=ts.options().barSpacing||6;
  const clampX=x=>Math.max(0,Math.min(R,x));
  
  function box(x1,x2,p1,p2,fill,stroke,label,dash){
    const ya=Y(Math.max(p1,p2)),yb=Y(Math.min(p1,p2));if(ya==null||yb==null)return;
    x1=clampX(x1);x2=clampX(x2);if(x2-x1<2)return;
    ctx.fillStyle=fill;ctx.fillRect(x1,ya,x2-x1,Math.max(1,yb-ya));
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.setLineDash(dash||[]);ctx.strokeRect(x1+.5,ya+.5,x2-x1,Math.max(1,yb-ya));ctx.setLineDash([]);}
    if(label){ctx.fillStyle=stroke||'#ddd';ctx.font='10px Arial';ctx.fillText(label,x1+4,ya+11);}
  }
  function hline(x1,x2,p,color,label,dash){
    const y=Y(p);if(y==null)return;x1=clampX(x1);x2=clampX(x2);if(x2-x1<2)return;
    ctx.strokeStyle=color;ctx.lineWidth=1;ctx.setLineDash(dash||[4,3]);
    ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.setLineDash([]);
    if(label){ctx.fillStyle=color;ctx.font='bold 10px Arial';ctx.fillText(label,(x1+x2)/2-10,y-3);}
  }

  if(S.show.pd&&S.bars.length>20){
    const n=Math.min(60,S.bars.length),sl=S.bars.slice(-n);
    let hi=-Infinity,lo=Infinity;sl.forEach(b=>{hi=Math.max(hi,b.high);lo=Math.min(lo,b.low);});
    const eq=(hi+lo)/2,x1=X(sl[0].time,0);
    box(x1,R,eq,hi,'rgba(255,59,92,.05)',null);
    box(x1,R,lo,eq,'rgba(0,230,118,.05)',null);
    hline(x1,R,eq,'rgba(255,255,255,.35)','EQ 0.5',[2,4]);
    ctx.fillStyle='rgba(255,59,92,.7)';ctx.font='9px Arial';const yh=Y(hi);if(yh!=null)ctx.fillText('PREMIUM',x1+4,yh+22);
    ctx.fillStyle='rgba(0,230,118,.8)';const yl=Y(lo);if(yl!=null)ctx.fillText('DISCOUNT',x1+4,yl-6);
  }

  S.zones.forEach(z=>{
    if(z.filled&&!S.show.filled)return;
    if(z.kind==='FVG'&&!S.show.fvg)return;
    if(z.kind==='OB'&&!S.show.ob)return;
    const a=z.filled?.07:.2,al=z.filled?.35:.8;
    const col=z.dir==='bull'?'0,230,118':(z.dir==='bear'?'255,59,92':'255,179,0');
    const arrow=z.dir==='bull'?' ▲':(z.dir==='bear'?' ▼':'');
    box(X(z.start,0),z.end?X(z.end,R):R,z.top,z.bottom,'rgba('+col+','+a+')','rgba('+col+','+al+')',z.kind+arrow,z.filled?[3,3]:null);
  });

  if(S.show.struct)S.events.forEach(e=>{
    const x1=X(e.start,0),x2=e.end?X(e.end,R):x1+14*bs;
    const c=/CHOCH|MSS/.test(e.label)?'#FFB300':(/SWEEP|LIQ|EQUAL/.test(e.label)?'#8C52FF':'#8A93A6');
    hline(x1,x2,e.price,c,e.label,/SWEEP|LIQ|EQUAL/.test(e.label)?[2,3]:[5,3]);
  });

  const s=S.setup;
  if(s&&S.show.lvl&&s.entry!=null&&s.sl!=null&&s.tp!=null){
    const last=S.bars[S.bars.length-1];
    const x1=s.time!=null?X(s.time,R-30*bs):X(S.bars[Math.max(0,S.bars.length-12)].time,0);
    const x2=Math.min(R,x1+45*bs);
    box(x1,x2,s.entry,s.tp,'rgba(0,230,118,.15)','rgba(0,230,118,.6)','TP');
    box(x1,x2,s.entry,s.sl,'rgba(255,59,92,.15)','rgba(255,59,92,.6)','SL');
    const rr=Math.abs(s.tp-s.entry)/Math.max(1e-12,Math.abs(s.entry-s.sl));
    const ye=Y(s.entry);if(ye!=null){ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.fillText('ENTRY · R:R 1:'+rr.toFixed(2),x1+4,ye-4);}
  }
}

function applyLevels(){
  S.lines.forEach(l=>{try{series.removePriceLine(l);}catch(e){}});S.lines=[];
  const s=S.setup;if(!s||!S.show.lvl)return;
  const add=(p,c,t)=>{if(p!=null)S.lines.push(series.createPriceLine({price:p,color:c,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:t}));};
  add(s.entry,'#8C52FF','ENTRY');add(s.sl,'#FF3B5C','SL');add(s.tp,'#00E676','TP');
}
function legend(){
  const b=S.bars[S.bars.length-1];if(!b)return;
  $('legend').textContent=S.sym+' · '+S.tf+'   O '+fmt(b.open)+'  H '+fmt(b.high)+'  L '+fmt(b.low)+'  C '+fmt(b.close);
  setText('price',fmt(b.close));
}

window.tick=function(p){
  p=Number(p);if(!Number.isFinite(p)||!series||!S.bars.length)return;
  const tfs=TF_SEC[S.tf]||900,now=Math.floor(Date.now()/1000),slot=now-now%tfs;
  let last=S.bars[S.bars.length-1];
  if(slot>last.time&&slot-last.time<=2*tfs){ 
    last={time:slot,open:last.close,high:p,low:p,close:p};S.bars.push(last);S.forming=last;
  }else{
    last.close=p;last.high=Math.max(last.high,p);last.low=Math.min(last.low,p);
  }
  series.update(last);legend();sched();
};

window.renderSignal=function(data,key){
  try{
    const m=data.market||{};
    const map=new Map();
    (Array.isArray(m.candles)?m.candles:[]).forEach(c=>{
      const t=toSec(c.time),o=num(c.open),h=num(c.high),l=num(c.low),cl=num(c.close);
      if(t==null||o==null||h==null||l==null||cl==null)return;
      map.set(t,{time:t,open:o,high:h,low:l,close:cl,volume:num(c.volume)||Math.random()*100});
    });
    const bars=Array.from(map.values()).sort((a,b)=>a.time-b.time);
    if(!bars.length)throw new Error('No usable market.candles in response.');
    const parts=String(key||'').split('|');
    const changed=key!==S.key;
    S.key=key;S.sym=parts[0]||data.symbol||'';S.tf=parts[1]||m.timeframe||'M15';

    if(!changed&&S.forming&&S.forming.time>bars[bars.length-1].time)bars.push(S.forming);else S.forming=null;

    const oldLen=S.bars.length;
    let range=changed?null:chart.timeScale().getVisibleLogicalRange();
    series.setData(bars);S.bars=bars;
    
    if(volumeSeries) {
        const vData = bars.map(b => ({
            time: b.time,
            value: b.volume, 
            color: b.close >= b.open ? 'rgba(0, 230, 118, 0.4)' : 'rgba(255, 59, 92, 0.4)'
        }));
        volumeSeries.setData(vData);
    }

    if(!range)chart.timeScale().fitContent();
    else{
      const delta=bars.length-oldLen;
      if(delta>0&&range.to>=oldLen-2)range={from:range.from+delta,to:range.to+delta};
      chart.timeScale().setVisibleLogicalRange(range);
    }

    const st=data.setup||data.signal||data.decision||(data.analysis&&data.analysis.setup)||{};
    const decision=String(st.decision||data.status||'NO_TRADE').toUpperCase();
    const dir=String(st.direction||st.side||'').toUpperCase();
    const noTrade=/NO_TRADE|WAIT|NONE/.test(decision);
    const pick=(o,ks)=>{for(const k of ks){const v=num(o[k]);if(v!=null)return v;}return null;};
    S.setup=noTrade?null:{entry:pick(st,['entry','entryPrice','entry_price','plannedEntry']),
      sl:pick(st,['stopLoss','stop_loss','sl']),tp:pick(st,['takeProfit','take_profit','tp','tp1','target']),
      time:toSec(st.createdAt||st.created_at||st.time),dir};
    applyLevels();

    const out={zones:[],events:[]};
    extract(data.analysis,out,0);extract(data.annotations,out,0);
    if(st.candidateZone&&num(st.candidateZone.top)!=null)extract([Object.assign({type:'OB'},st.candidateZone)],out,0);
    const cur=bars[bars.length-1].close;
    const zs=dedupe(out.zones,z=>[z.kind,z.top,z.bottom,z.start].join('|'));
    const live=zs.filter(z=>!z.filled).sort((a,b)=>Math.abs((a.top+a.bottom)/2-cur)-Math.abs((b.top+b.bottom)/2-cur));
    const keep=[].concat(live.filter(z=>z.kind==='FVG').slice(0,4),live.filter(z=>z.kind==='OB').slice(0,3),zs.filter(z=>z.filled).slice(-4));
    S.zones=keep;
    S.events=dedupe(out.events,e=>[e.label,e.price,e.start].join('|')).slice(-10);

    setText('decision',noTrade?'NO TRADE · WAIT':(dir||decision)+' SETUP');
    $('decision').className=noTrade?'amber':(dir==='SELL'?'red':'green');
    setText('tf','Timeframe: '+S.tf);setText('provider','Provider: '+(m.provider||data.provider||'Backend'));
    setText('count','Candles: '+(m.closedCandleCount||bars.length));
    const L=[];
    if(st.confidenceLabel||st.confidence)L.push('Confidence: '+(st.confidenceLabel||st.confidence));
    if(st.score!=null)L.push('Score: '+st.score+(st.maxScore!=null?' / '+st.maxScore:''));
    if(st.entryStatus)L.push('Entry: '+st.entryStatus);
    const an=data.analysis||{};
    if(an.trend)L.push('Trend: '+(typeof an.trend==='string'?an.trend:(an.trend.direction||an.trend.bias||JSON.stringify(an.trend))));
    const rs=Array.isArray(st.reasons)?st.reasons:(Array.isArray(st.evidence)?st.evidence:[]);
    if(rs.length)L.push('Reasons:\n• '+rs.map(x=>typeof x==='string'?x:(x.label||x.text||JSON.stringify(x))).join('\n• '));
    if(noTrade&&!rs.length)L.push('No confirmed setup returned by the backend.');
    setText('detail',L.join('\n'));
    legend();sched();
  }catch(e){setText('decision','Could not render data');setText('detail',String(e&&e.message||e));}
};
init();
})();
</script>
</body>
</html>
