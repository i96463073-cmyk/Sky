name: Build Sky APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sky
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Download Offline Chart Library
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/lightweight-charts.js https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sky-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
